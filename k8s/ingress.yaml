apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rails-crud-ingress
  namespace: default
  labels:
    app: rails-crud-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rails-crud-service
                port:
                  number: 3000
