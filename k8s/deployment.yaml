apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-crud-app
  namespace: default
  labels:
    app: rails-crud-app
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rails-crud-app
  template:
    metadata:
      labels:
        app: rails-crud-app
        tier: web
    spec:
      containers:
        - name: rails-app
          image: rails-crud-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: RAILS_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgrespassword"
            - name: DB_NAME
              value: "devops_project_prod"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
